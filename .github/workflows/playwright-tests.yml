name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      publish-slack:
        description: 'Publish report and send Slack notification'
        required: false
        default: 'false'
        type: boolean
      slack-channel:
        description: 'Slack channel ID for notification'
        required: false
        default: ''
        type: string
      framework:
        description: 'Test framework name'
        required: false
        default: 'Playwright'
        type: string
      watcher-version:
        description: 'Watcher version used'
        required: false
        default: ''
        type: string

env:
  NODE_VERSION: '22'
  WORKING_DIRECTORY: './ts/playwright'

jobs:
  playwright-tests:
    name: Run All Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('ts/playwright/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Java
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre

      - name: Create directories
        run: |
          mkdir -p logs allure-results

      - name: Set environment variables
        run: |
          echo "PLAYWRIGHT_API_KEY_GIT=${{ secrets.PLAYWRIGHT_API_KEY_GIT || 'c79e09b0-43fc-44a5-aff5-47fb5fe8c21b' }}" >> $GITHUB_ENV
          echo "AXE_PASSWORD=${{ secrets.AXE_PASSWORD || 'Password@123' }}" >> $GITHUB_ENV
          echo "TARGET_ENVIRONMENT=${{ secrets.TARGET_ENVIRONMENT || 'qa' }}" >> $GITHUB_ENV
          echo "CI=true" >> $GITHUB_ENV

      - name: Run all tests
        id: test-all
        timeout-minutes: 60
        continue-on-error: true
        run: |
          npm run test-all && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Setup Allure
        if: always()
        run: |
          wget -qO- https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz | tar -xz
          sudo mv allure-2.34.1 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate Allure Report
        if: always()
        run: |
          # Generate Allure report
          allure generate allure-results -o allure-report --clean || echo "No test results to generate report"
        continue-on-error: true

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: logs/
          retention-days: 30

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        if: always()
        run: |
          # Create allure-history directory if it doesn't exist
          mkdir -p allure-history
          
          # Copy existing history if it exists
          if [ -d "gh-pages/allure-history" ]; then
            cp -r gh-pages/allure-history/* allure-history/ || true
          fi
          
          # Generate new Allure report
          allure generate allure-results -o allure-report --clean
          
          # Copy new report to history
          timestamp=$(date +%Y%m%d_%H%M%S)
          mkdir -p "allure-history/$timestamp"
          cp -r allure-report/* "allure-history/$timestamp/" || true
          
          # Create index.html that redirects to latest report
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url='$timestamp'/index.html"></head></html>' > allure-history/index.html
        continue-on-error: true

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ always() && github.event.inputs.publish-slack == 'true' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

