name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      publish-slack:
        description: 'Publish report and send Slack notification'
        required: false
        default: 'false'
        type: boolean
      slack-channel:
        description: 'Slack channel ID for notification'
        required: false
        default: ''
        type: string
      framework:
        description: 'Test framework name'
        required: false
        default: 'Playwright'
        type: string
      watcher-version:
        description: 'Watcher version used'
        required: false
        default: ''
        type: string

env:
  NODE_VERSION: '22'
  WORKING_DIRECTORY: './ts/playwright'

jobs:
  playwright-tests:
    name: Run All Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('ts/playwright/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Java
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre

      - name: Create directories
        run: |
          mkdir -p logs allure-results

      - name: Set environment variables
        run: |
          echo "PLAYWRIGHT_API_KEY_GIT=${{ secrets.PLAYWRIGHT_API_KEY_GIT || 'fea891a5-938f-40e4-a819-b53806c30d6f' }}" >> $GITHUB_ENV
          echo "AXE_PASSWORD=${{ secrets.AXE_PASSWORD || 'Password@123' }}" >> $GITHUB_ENV
          echo "TARGET_ENVIRONMENT=${{ secrets.TARGET_ENVIRONMENT || 'qa' }}" >> $GITHUB_ENV
          echo "CI=true" >> $GITHUB_ENV

      - name: Run all tests
        id: test-all
        timeout-minutes: 60
        continue-on-error: true
        run: |
          npm run test-all && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Upload Allure Results and Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-and-logs
          path: |
            allure-results/
            logs/
          retention-days: 30

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.9
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: allure-results

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ always() && github.event.inputs.publish-slack == 'true' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Notify on Slack
        uses: slackapi/slack-github-action@v1.26
        if: ${{ always() && github.event.inputs.publish-slack == 'true' }}
        with:
          channel-id: ${{ github.event.inputs.slack-channel }}
          slack-message: |
            ${{ job.status == 'success' && '✅ *Automation Regression Passed*' || '❌ *Automation Regression Failed*' }}
             • *Platform:* `${{ github.event.inputs.framework }}`
             • *Status:* `${{ job.status }}`
             • *Watcher Version:* `${{ github.event.inputs.watcher-version }}`
             📊 <https://dequelabs.github.io/qa-axe-watcher-daf/|View Allure Report>
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

