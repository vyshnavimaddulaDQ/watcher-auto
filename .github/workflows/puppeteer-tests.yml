name: Puppeteer Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'js/puppeteer/**'
      - '.github/workflows/puppeteer-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'js/puppeteer/**'
      - '.github/workflows/puppeteer-tests.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  WORKING_DIRECTORY: './js/puppeteer'
  TEST_DELAY_SECONDS: '10'  # Delay in seconds between test scripts

jobs:
  puppeteer-tests:
    name: Run All Puppeteer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('js/puppeteer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Java and Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget -q https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -xzf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure

      - name: Create directories
        run: |
          mkdir -p logs allure-results

      - name: Set environment variables
        run: |
          echo "PUPPETEER_API_KEY_GIT=${{ secrets.PUPPETEER_API_KEY_GIT || 'fea891a5-938f-40e4-a819-b53806c30d6f' }}" >> $GITHUB_ENV
          echo "AXE_PASSWORD=${{ secrets.AXE_PASSWORD || 'Password@123' }}" >> $GITHUB_ENV
          echo "TARGET_ENVIRONMENT=${{ secrets.TARGET_ENVIRONMENT || 'qa' }}" >> $GITHUB_ENV
          echo "CI=true" >> $GITHUB_ENV

      - name: Run autoAnalyzeMode tests
        id: test-autoAnalyzeMode
        timeout-minutes: 15
        continue-on-error: true
        run: |
          npm run autoAnalyzeMode && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Wait before next test
        if: always()
        run: |
          echo "⏳ Waiting ${{ env.TEST_DELAY_SECONDS }} seconds before next test suite..."
          sleep ${{ env.TEST_DELAY_SECONDS }}

      - name: Run manualMode tests
        id: test-manualMode
        timeout-minutes: 15
        continue-on-error: true
        run: |
          npm run manualMode && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Wait before next test
        if: always()
        run: |
          echo "⏳ Waiting ${{ env.TEST_DELAY_SECONDS }} seconds before next test suite..."
          sleep ${{ env.TEST_DELAY_SECONDS }}

      - name: Run axeConfigurations tests
        id: test-axeConfigurations
        timeout-minutes: 15
        continue-on-error: true
        run: |
          npm run axeConfigurations && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Wait before next test
        if: always()
        run: |
          echo "⏳ Waiting ${{ env.TEST_DELAY_SECONDS }} seconds before next test suite..."
          sleep ${{ env.TEST_DELAY_SECONDS }}

      - name: Run excludeURLs tests
        id: test-excludeURLs
        timeout-minutes: 15
        continue-on-error: true
        run: |
          npm run excludeURLs && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Wait before next test
        if: always()
        run: |
          echo "⏳ Waiting ${{ env.TEST_DELAY_SECONDS }} seconds before next test suite..."
          sleep ${{ env.TEST_DELAY_SECONDS }}

      - name: Run configureOverrides tests
        id: test-configureOverrides
        timeout-minutes: 15
        continue-on-error: true
        run: |
          npm run configureOverrides && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Wait before next test
        if: always()
        run: |
          echo "⏳ Waiting ${{ env.TEST_DELAY_SECONDS }} seconds before next test suite..."
          sleep ${{ env.TEST_DELAY_SECONDS }}

      - name: Run wrapMethods tests
        id: test-wrapMethods
        timeout-minutes: 15
        continue-on-error: true
        run: |
          npm run wrapMethods && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Wait before next test
        if: always()
        run: |
          echo "⏳ Waiting ${{ env.TEST_DELAY_SECONDS }} seconds before next test suite..."
          sleep ${{ env.TEST_DELAY_SECONDS }}

      - name: Run edgeCases tests
        id: test-edgeCases
        timeout-minutes: 15
        continue-on-error: true
        run: |
          npm run edgeCases && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results found"
            exit 1
          fi

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-report
          path: js/puppeteer/allure-report
          retention-days: 30
          if-no-files-found: error

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 🧪 Puppeteer Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| autoAnalyzeMode | ${{ steps.test-autoAnalyzeMode.outputs.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| manualMode | ${{ steps.test-manualMode.outputs.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| axeConfigurations | ${{ steps.test-axeConfigurations.outputs.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| excludeURLs | ${{ steps.test-excludeURLs.outputs.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| configureOverrides | ${{ steps.test-configureOverrides.outputs.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| wrapMethods | ${{ steps.test-wrapMethods.outputs.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| edgeCases | ${{ steps.test-edgeCases.outputs.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 [View Allure Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: puppeteer-tests
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Send Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🧪 Puppeteer Tests - ${{ needs.puppeteer-tests.result == 'success' && '✅ Success' || '❌ Failure' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🧪 Puppeteer Test Execution"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ needs.puppeteer-tests.result == 'success' && '✅ Success' || '❌ Failure' }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
        continue-on-error: true
