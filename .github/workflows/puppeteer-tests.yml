name: Puppeteer Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'js/puppeteer/**'
      - '.github/workflows/puppeteer-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'js/puppeteer/**'
      - '.github/workflows/puppeteer-tests.yml'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run (leave empty for all)'
        required: false
        type: choice
        options:
          - ''
          - autoAnalyzeMode
          - manualMode
          - axeConfigurations
          - excludeURLs
          - configureOverrides
          - wrapMethods
          - edgeCases

jobs:
  puppeteer-tests:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./js/puppeteer

    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - autoAnalyzeMode
          - manualMode
          - axeConfigurations
          - excludeURLs
          - configureOverrides
          - wrapMethods
          - edgeCases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: js/puppeteer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run ${{ matrix.test-suite }} tests
        env:
          PUPPETEER_API_KEY_GIT: ${{ secrets.PUPPETEER_API_KEY_GIT }}
          AXE_PASSWORD: ${{ secrets.AXE_PASSWORD }}
          TARGET_ENVIRONMENT: ${{ secrets.TARGET_ENVIRONMENT || 'qa' }}
          CI: true
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.test_suite }}" != "" ] && [ "${{ github.event.inputs.test_suite }}" != "${{ matrix.test-suite }}" ]; then
            echo "Skipping ${{ matrix.test-suite }} - only running ${{ github.event.inputs.test_suite }}"
            exit 0
          fi
          npm run ${{ matrix.test-suite }} || true
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            npx allure generate allure-results --clean -o allure-report || true
          else
            echo "No allure-results found, skipping report generation"
          fi

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.test-suite }}
          path: js/puppeteer/allure-report
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.test-suite }}
          path: js/puppeteer/allure-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.test-suite }}
          path: js/puppeteer/logs
          retention-days: 7
          if-no-files-found: ignore

  summary:
    runs-on: ubuntu-latest
    needs: puppeteer-tests
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all Allure Reports
        uses: actions/download-artifact@v4
        with:
          path: allure-reports
          pattern: allure-report-*
          merge-multiple: false

      - name: Setup Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -xzf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate Combined Allure Report
        if: always()
        run: |
          mkdir -p combined-allure-results
          for dir in allure-reports/*/; do
            if [ -d "$dir" ]; then
              find "$dir" -name "*.json" -o -name "*.txt" -o -name "*.png" | while read file; do
                cp "$file" combined-allure-results/ 2>/dev/null || true
              done
            fi
          done
          if [ "$(ls -A combined-allure-results 2>/dev/null)" ]; then
            allure generate combined-allure-results --clean -o combined-allure-report || true
          else
            echo "No combined results found"
          fi

      - name: Upload Combined Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-report
          path: combined-allure-report
          retention-days: 30
          if-no-files-found: ignore

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          for suite in autoAnalyzeMode manualMode axeConfigurations excludeURLs configureOverrides wrapMethods edgeCases; do
            if [ "${{ needs.puppeteer-tests.result }}" == "success" ]; then
              echo "| $suite | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $suite | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 [View Combined Allure Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

