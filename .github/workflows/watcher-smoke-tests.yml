name: Watcher Smoke Tests

on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  watcher-smoke-tests:
    name: Run Smoke Tests (autoAnalyzeMode)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    strategy:
      fail-fast: false
      matrix:
        framework:
          - name: PlaywrightTest
            directory: ts/playwrightTest
            env_var: PW_TEST_API_KEY_GIT
          - name: Playwright
            directory: ts/playwright
            env_var: PLAYWRIGHT_API_KEY_GIT
          - name: Puppeteer
            directory: js/puppeteer
            env_var: PUPPETEER_API_KEY_GIT
          - name: Cypress
            directory: js/cypress
            env_var: CYPRESS_API_KEY_GIT
    
    defaults:
      run:
        working-directory: ${{ matrix.framework.directory }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles(format('{0}/package-lock.json', matrix.framework.directory)) }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright browsers
        if: matrix.framework.name == 'PlaywrightTest' || matrix.framework.name == 'Playwright'
        run: npx playwright install --with-deps chromium

      - name: Setup Java
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre

      - name: Create directories
        run: |
          mkdir -p logs allure-results

      - name: Set environment variables
        run: |
          echo "${{ matrix.framework.env_var }}=${{ secrets[matrix.framework.env_var] || 'fea891a5-938f-40e4-a819-b53806c30d6f' }}" >> $GITHUB_ENV
          echo "AXE_PASSWORD=${{ secrets.AXE_PASSWORD || 'Password@123' }}" >> $GITHUB_ENV
          echo "TARGET_ENVIRONMENT=${{ secrets.TARGET_ENVIRONMENT || 'qa' }}" >> $GITHUB_ENV
          echo "CI=true" >> $GITHUB_ENV

      - name: Run autoAnalyzeMode tests
        id: test-autoAnalyzeMode
        timeout-minutes: 10
        continue-on-error: true
        run: |
          npm run autoAnalyzeMode && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.framework.name }}
          path: |
            ${{ matrix.framework.directory }}/allure-results/
            ${{ matrix.framework.directory }}/logs/
          retention-days: 7

  combine-results:
    name: Combine Smoke Test Results
    runs-on: ubuntu-latest
    needs: watcher-smoke-tests
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          continue-on-error: true

      - name: Merge Allure Results
        run: |
          mkdir -p combined-allure-results
          
          # Copy results from each framework
          for framework_dir in artifacts/*/; do
            if [ -d "${framework_dir}" ]; then
              framework_name=$(basename "$framework_dir")
              echo "Processing results from $framework_name"
              
              # Find allure-results directory
              if [ -d "${framework_dir}allure-results" ] && [ -n "$(ls -A ${framework_dir}allure-results 2>/dev/null)" ]; then
                echo "Merging results from $framework_name"
                cp -r ${framework_dir}allure-results/* combined-allure-results/ || true
              fi
            fi
          done
          
          echo "Total files in combined report: $(ls -1 combined-allure-results 2>/dev/null | wc -l)"

      - name: Upload Combined Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-smoke-allure-results
          path: combined-allure-results/
          retention-days: 7

  publish-report:
    name: Publish Smoke Test Report
    runs-on: ubuntu-latest
    needs: combine-results
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Combined Allure Results
        uses: actions/download-artifact@v4
        with:
          name: combined-smoke-allure-results
          path: combined-allure-results

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Allure
        run: |
          wget -qO- https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz | tar -xz
          sudo mv allure-2.34.1 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Build Smoke Test Allure Report
        run: |
          # Create smoke-test-history directory if it doesn't exist
          mkdir -p smoke-test-history
          
          # Copy existing history if it exists
          if [ -d "gh-pages/smoke-test-history" ]; then
            cp -r gh-pages/smoke-test-history/* smoke-test-history/ || true
          fi
          
          # Generate new Allure report
          if [ -d "combined-allure-results" ] && [ -n "$(ls -A combined-allure-results 2>/dev/null)" ]; then
            allure generate combined-allure-results -o allure-report --clean
          else
            echo "No allure results found, creating empty report"
            mkdir -p allure-report
            echo '<html><body><h1>No test results available</h1></body></html>' > allure-report/index.html
          fi
          
          # Copy new report to history
          timestamp=$(date +%Y%m%d_%H%M%S)
          mkdir -p "smoke-test-history/$timestamp"
          cp -r allure-report/* "smoke-test-history/$timestamp/" || true
          
          # Create index.html that redirects to latest report
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url='$timestamp'/index.html"></head></html>' > smoke-test-history/index.html
        continue-on-error: true

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: smoke-test-history

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 🧪 Smoke Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This smoke test run includes **autoAnalyzeMode** tests from all frameworks:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Framework | Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| PlaywrightTest | autoAnalyzeMode | ✅ Run |" >> $GITHUB_STEP_SUMMARY
          echo "| Playwright | autoAnalyzeMode | ✅ Run |" >> $GITHUB_STEP_SUMMARY
          echo "| Puppeteer | autoAnalyzeMode | ✅ Run |" >> $GITHUB_STEP_SUMMARY
          echo "| Cypress | autoAnalyzeMode | ✅ Run |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "📊 [View Smoke Test Report](https://${{ github.repository_owner }}.github.io/$REPO_NAME/smoke-test-history/)" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [smoke-tests, publish-report]
    if: always()
    
    steps:
      - name: Prepare Slack Data
        id: slack-data
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "report_url=https://${{ github.repository_owner }}.github.io/$REPO_NAME/smoke-test-history/" >> $GITHUB_OUTPUT

      - name: Notify on Slack
        uses: slackapi/slack-github-action@v1.26
        if: always()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "${{ needs.publish-report.result == 'success' && '✅ *Smoke Tests Completed*' || '❌ *Smoke Tests Failed*' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.publish-report.result == 'success' && '✅ *Smoke Tests Completed*' || '❌ *Smoke Tests Failed*' }}\n• *Branch:* `${{ github.ref_name }}`\n• *Status:* `${{ needs.publish-report.result }}`\n• *Commit:* <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ steps.slack-data.outputs.short_sha }}>\n📊 <${{ steps.slack-data.outputs.report_url }}|View Smoke Test Report>"
                  }
                }
              ]
            }
        continue-on-error: true

